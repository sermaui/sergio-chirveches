<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke Maui — Presupuesto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="page-header">
        <nav class="navbar" aria-label="Navegación principal">
            <a href="index.html" class="logo">🎤 Karaoke Maui</a>
            <ul class="menu">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="presupuesto.html" class="activo" aria-current="page">Presupuesto</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <div class="page-title"><p class="eyebrow">Planifica tu noche</p><h1>Solicita tu presupuesto</h1><p>Cuéntanos qué tienes en mente y prepararemos una propuesta a tu medida.</p></div>
    </header>
    <main class="page-main">
        <section class="contacto">
            <h2>Datos del evento</h2>
            <form action="contacto.html" method="get">
                <label for="nombre">Nombre</label><input type="text" id="nombre" name="nombre" required minlength="3" placeholder="Tu nombre">
                <label for="email">Correo electrónico</label><input type="email" id="email" name="email" required placeholder="ejemplo@dominio.com">
                <label for="servicio">Servicio que te interesa</label>
                <select id="servicio" name="servicio" required><option value="">Selecciona una opción</option><option>Noches de Karaoke</option><option>Fiesta privada</option><option>Evento con DJ</option></select>
                <label for="fecha">Fecha aproximada</label><input type="date" id="fecha" name="fecha">
                <label for="mensaje">Cuéntanos más</label><textarea id="mensaje" name="mensaje" required minlength="10" placeholder="Número de personas, horario, lugar..."></textarea>
                <button type="submit">Enviar solicitud</button>
            </form>
        </section>
    </main>
    <footer><p>© 2024 Karaoke Maui · <a href="contacto.html">Contacto</a></p></footer>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Solicita un presupuesto para tu evento con Karaoke Maui.">
    <title>Karaoke Maui | Presupuesto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="page-header">
        <!-- El menú principal vuelve a aparecer aquí para mantener una navegación constante en todas las páginas -->
        <nav class="navbar" aria-label="Navegación principal">
            <a class="logo" href="index.html">🎤 Karaoke Maui</a>
            <ul class="menu">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a class="activo" aria-current="page" href="presupuesto.html">Presupuesto</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>

        <!-- Cabecera de la página para orientar al usuario antes de completar el formulario -->
        <div class="page-title">
            <p class="eyebrow">Planifica tu noche</p>
            <h1>Solicita tu presupuesto</h1>
            <p>Cuéntanos qué tienes en mente y prepararemos una propuesta a medida.</p>
        </div>
    </header>

    <main class="page-main">
        <!-- Formulario principal para recoger los datos del evento y dejar la solicitud lista -->
        <section class="panel form-panel">
            <h2>Datos del evento</h2>
            <form action="contacto.html" method="get">
                <label for="nombre">Nombre</label>
                <input id="nombre" name="nombre" type="text" minlength="3" required placeholder="Tu nombre">

                <label for="email">Correo electrónico</label>
                <input id="email" name="email" type="email" required placeholder="ejemplo@dominio.com">

                <label for="servicio">Servicio</label>
                <select id="servicio" name="servicio" required>
                    <option value="">Selecciona una opción</option>
                    <option value="karaoke">Noche de karaoke</option>
                    <option value="fiesta">Fiesta privada</option>
                    <option value="dj">Evento con DJ</option>
                </select>

                <label for="fecha">Fecha aproximada</label>
                <input id="fecha" name="fecha" type="date">

                <label for="mensaje">Detalles del evento</label>
                <textarea id="mensaje" name="mensaje" minlength="10" required placeholder="Número de personas, horario, lugar..."></textarea>

                <label class="check-label" for="privacidad">
                    <input id="privacidad" name="privacidad" type="checkbox" required>
                    He leído y acepto la política de privacidad.
                </label>

                <button class="btn btn-primary" type="submit">Enviar solicitud</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2024 Karaoke Maui · <a href="contacto.html">Contacto</a></p>
    </footer>
</body>
</html>

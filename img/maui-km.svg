<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#061022" />
      <stop offset="50%" stop-color="#123a6a" />
      <stop offset="100%" stop-color="#2a67b3" />
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.9)" />
      <stop offset="40%" stop-color="rgba(255,255,255,0.18)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="100%" height="100%" fill="url(#bg)" />

  <!-- stage floor -->
  <ellipse cx="700" cy="440" rx="620" ry="60" fill="rgba(0,0,0,0.25)"/>

  <!-- spotlights -->
  <g opacity="0.9">
    <ellipse cx="420" cy="80" rx="220" ry="120" fill="url(#spot)" transform="rotate(-18 420 80)" />
    <ellipse cx="980" cy="80" rx="220" ry="120" fill="url(#spot)" transform="rotate(18 980 80)" />
  </g>

  <!-- speakers -->
  <g fill="#222" stroke="#111" stroke-width="4">
    <rect x="90" y="150" width="120" height="220" rx="12" />
    <circle cx="150" cy="220" r="34" fill="#f2c94c" />
    <circle cx="150" cy="310" r="50" fill="#fad961" />

    <rect x="1180" y="150" width="120" height="220" rx="12" />
    <circle cx="1240" cy="220" r="34" fill="#f2c94c" />
    <circle cx="1240" cy="310" r="50" fill="#fad961" />
  </g>

  <!-- mic stand -->
  <g stroke="#ddd" stroke-width="6" stroke-linecap="round">
    <line x1="900" y1="110" x2="900" y2="380" />
    <circle cx="900" cy="95" r="14" fill="#fff" />
  </g>

  <!-- more realistic character -->
  <g transform="translate(620,150)">
    <!-- legs -->
    <path d="M-24,170 C-24,170 -24,250 0,250 H14 C30,250 30,170 30,170 Z" fill="#11172a" />
    <path d="M30,170 C30,170 30,250 56,250 H70 C70,220 62,180 56,170 Z" fill="#0e2c4a" />
    <path d="M-24,170 C-24,170 -24,250 -48,250 H-32 C-32,220 -24,180 -24,170 Z" fill="#0e2c4a" />
    <!-- body -->
    <path d="M-44,82 C-44,82 -26,38 0,38 C26,38 44,82 44,82 L44,170 C44,170 44,210 24,210 H-24 C-44,210 -44,170 -44,170 Z" fill="#ffffff" />
    <path d="M-24,102 C-24,102 -12,80 0,80 C12,80 24,102 24,102 L24,170 H-24 Z" fill="#e9ecef" opacity="0.8" />
    <path d="M-44,82 C-44,82 -60,110 -60,130 L-60,150 C-60,160 -44,170 -44,170 Z" fill="#11172a" opacity="0.1" />
    <path d="M44,82 C44,82 60,110 60,130 L60,150 C60,160 44,170 44,170 Z" fill="#11172a" opacity="0.1" />
    <!-- arms and mic -->
    <path d="M40,108 C28,120 26,148 36,160 C44,170 60,180 70,170 C82,158 74,134 64,128 C54,122 46,110 40,108 Z" fill="#f2d7c9" />
    <path d="M-42,110 C-34,126 -36,148 -28,162 C-20,176 -4,176 4,162 C14,148 22,132 18,118 C10,102 -6,100 -14,106 Z" fill="#f2d7c9" />
    <path d="M66,122 C68,130 68,150 58,156 L58,196 C58,206 50,210 44,210 H28 C24,210 18,202 18,196 L18,156 C10,148 8,132 12,122 C18,112 46,110 56,118 C66,126 64,118 66,122 Z" fill="#11172a" opacity="0.1" />
    <path d="M58,130 L58,188" stroke="#333" stroke-width="4" stroke-linecap="round" />
    <path d="M36,138 C36,138 24,128 16,116" stroke="#000" stroke-width="2" fill="none" opacity="0.4" />
    <path d="M48,130 C52,128 56,132 54,138" stroke="#000" stroke-width="2" fill="none" opacity="0.4" />
    <path d="M58,180 L74,184" stroke="#333" stroke-width="4" />
    <circle cx="76" cy="182" r="8" fill="#2b2b2b" />
    <circle cx="76" cy="182" r="4" fill="#ececec" />
    <!-- head -->
    <ellipse cx="0" cy="36" rx="44" ry="48" fill="#f2d7c9" />
    <path d="M-36,32 C-30,10 -8,-6 0,-8 C8,-6 30,10 36,32 C32,40 24,34 12,30 C0,26 -12,30 -24,30 C-32,32 -36,40 -36,32 Z" fill="#1f1f2d" />
    <path d="M-24,20 C-20,12 -12,6 0,6 C12,6 20,12 24,20" fill="#f2d7c9" />
    <circle cx="-15" cy="34" r="8" fill="#292929" />
    <circle cx="15" cy="34" r="8" fill="#292929" />
    <circle cx="-15" cy="34" r="3" fill="#fff" opacity="0.9" />
    <circle cx="15" cy="34" r="3" fill="#fff" opacity="0.9" />
    <path d="M-18,52 C-10,62 10,62 18,52" stroke="#7f4d2c" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M-18,46 C-0,52 18,46" stroke="#7f4d2c" stroke-width="3" fill="none" opacity="0.8" />
    <ellipse cx="0" cy="42" rx="24" ry="6" fill="#000" opacity="0.08" />
    <path d="M-32,18 C-22,10 0,-4 18,4" stroke="#1f1f2d" stroke-width="5" fill="none" stroke-linecap="round" />
    <path d="M32,18 C22,10 0,-4 -18,4" stroke="#1f1f2d" stroke-width="5" fill="none" stroke-linecap="round" />
    <!-- jacket shading -->
    <path d="M-44,82 C-44,82 -30,100 -18,104 C-6,108 6,104 18,100 C30,96 44,82 44,82" fill="#f0f2f7" opacity="0.5" />
    <path d="M-26,210 C-26,230 18,230 18,210 C18,210 -26,210 -26,210 Z" fill="#0f1b2f" opacity="0.2" />
  </g>

  <!-- logo KM -->
  <g transform="translate(60,60)">
    <text x="0" y="0" font-family="Verdana,Arial,sans-serif" font-size="96" font-weight="700" fill="#ffed6f" stroke="#2a2a2a" stroke-width="3">KM</text>
  </g>

  <!-- MAUI text -->
  <g transform="translate(40,460)">
    <text x="0" y="0" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="800" fill="#00ffb3" stroke="#0a2a2a" stroke-width="1">MAUI</text>
  </g>

  <!-- subtle crowd dots -->
  <g fill="#ffffff" opacity="0.06">
    <circle cx="300" cy="320" r="3" />
    <circle cx="340" cy="290" r="2.5" />
    <circle cx="380" cy="300" r="3.2" />
    <circle cx="450" cy="310" r="2.8" />
    <circle cx="520" cy="295" r="3" />
    <circle cx="760" cy="305" r="2.6" />
    <circle cx="920" cy="320" r="3" />
    <circle cx="1060" cy="300" r="2.7" />
  </g>

</svg>
